<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="coinShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Emerald to Teal Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Inner border highlight -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" />

  <!-- Back Coin (angled) -->
  <g filter="url(#shadow)">
    <circle cx="39" cy="27" r="14" fill="#047857" stroke="#A7F3D0" stroke-width="2.5" />
    <circle cx="39" cy="27" r="10" stroke="#A7F3D0" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6" />
    <!-- Back coin symbol ($/currency tick) -->
    <path d="M39 21v12M36 24h6M36 30h6" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Front Coin (prominent) -->
  <g filter="url(#shadow)">
    <circle cx="27" cy="37" r="15" fill="url(#coinGold)" stroke="#FEF08A" stroke-width="2.5" />
    <circle cx="27" cy="37" r="15" fill="url(#coinShine)" />
    <circle cx="27" cy="37" r="11" stroke="#CA8A04" stroke-width="1.5" opacity="0.5" />
    <!-- Front Coin Symbol (C for CoinTrail) -->
    <path d="M31.5 31.5a6.5 6.5 0 1 0 0 11c2.2 0 3.8-1.2 4.5-2.8" stroke="#854D0E" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Sparkling Star Accent -->
  <path d="M48 14l1.2 3.8L53 19l-3.8 1.2L48 24l-1.2-3.8L43 19l3.8-1.2z" fill="#FEF08A" opacity="0.9" />
</svg>
