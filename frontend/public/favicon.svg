<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich emerald-to-teal background gradient with depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Metallic Coin Rim Gradient -->
    <linearGradient id="coinRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.95" />
    </linearGradient>

    <!-- Inner Coin Core Gradient -->
    <radialGradient id="coinCoreGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- Dynamic Trail Gradient: glowing from soft cyan into bright crisp white -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#6ee7b7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow for Coin & Trail Depth -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#022c22" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" stroke="url(#glassRim)" stroke-width="1.2" />

  <!-- Coin & Flowing Growth Trail Graphic -->
  <g filter="url(#softGlow)">
    <!-- Dynamic Orbiting "Trail" (Ascending momentum wave sweeping around and through the coin) -->
    <path
      d="M13 47 C 18 45, 23 39, 27 31 C 31 22, 38 17, 50 17"
      stroke="url(#trailGrad)"
      stroke-width="4"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Secondary Harmonic Speed Wave (Lower trail depth) -->
    <path
      d="M16 53 C 21 51, 26 46, 29 40"
      stroke="#a7f3d0"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- Trail Arrowhead (Growth Vector) -->
    <path
      d="M44 12 L51.5 17 L44.5 22.5"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- The 3D Coin Badge (Positioned at center-right of curvature) -->
    <circle cx="34" cy="30" r="13" fill="url(#coinCoreGrad)" stroke="url(#coinRimGrad)" stroke-width="2.5" />
    
    <!-- Coin Inner Minted Bevel Ring -->
    <circle cx="34" cy="30" r="9.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2.5 1.5" />

    <!-- Center Coin Currency / Growth Spark Symbol -->
    <path
      d="M34 23.5 V 36.5 M30 26 H 36.5 C 38 26, 38.5 28, 37.5 29 C 36.5 30, 32 30, 31 31 C 30 32, 30.5 34, 32 34 H 38"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Ambient Sparkle Node at the Arrow Tip -->
    <circle cx="51.5" cy="17" r="1.5" fill="#ffffff" />
  </g>
</svg>
