<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Exactly matches CoinTrail UI: emerald-600 to teal-500 gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow for crisp white glyph -->
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#064e3b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base (exact shape & gradient matching CoinTrail's UI) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGradient)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="url(#rimHighlight)" stroke-width="1" />

  <!-- Iconic Coin + Trail Glyph in Pure Crisp White -->
  <g filter="url(#crispShadow)">
    <!-- Main Outer Coin Ring -->
    <circle cx="33" cy="31" r="14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- Coin Inner Core Node -->
    <circle cx="33" cy="31" r="5" fill="#ffffff" />

    <!-- The Upward "Trail" Wave: Flowing from bottom-left under and past the coin into a growth arrow -->
    <path
      d="M14 46 C 20 44, 25 38, 28 31 C 31 24, 38 18, 48 18"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Upward Trail Arrowhead -->
    <path
      d="M42 14 L49 18 L43 23"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Velocity Ripple Dash (Trail Motion) -->
    <path
      d="M17 52 C 22 50, 26 46, 29 41"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.6"
    />
  </g>
</svg>
