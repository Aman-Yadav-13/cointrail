<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian with Emerald Depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021c16" />
    </linearGradient>

    <!-- Trail Ribbon Gradient: Electric Emerald to Vibrant Cyan -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Trail Glow Gradient -->
    <linearGradient id="trailGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
    </linearGradient>

    <!-- Coin Gold Metallic Gradient -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="goldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <linearGradient id="coinShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bezel Border Highlight -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.5" />
    </linearGradient>

    <!-- Filters for High-End Glow & Depth -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Premium Rounded Squircle Container -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="3.5" y="3.5" width="93" height="93" rx="25.5" stroke="url(#bezelGrad)" stroke-width="1.5" />

  <!-- Ambient Backdrop Light Burst -->
  <circle cx="58" cy="42" r="28" fill="#10b981" opacity="0.18" filter="url(#neonGlow)" />
  <circle cx="42" cy="58" r="22" fill="#06b6d4" opacity="0.14" filter="url(#neonGlow)" />

  <!-- 1. The Sweeping "Trail" Ribbon (Behind the Coin) -->
  <path
    d="M16 78 C 22 76, 28 68, 32 58 C 36 46, 42 34, 52 26 C 60 20, 70 18, 80 16"
    stroke="url(#trailGlow)"
    stroke-width="7"
    stroke-linecap="round"
    opacity="0.4"
    filter="url(#neonGlow)"
  />
  <path
    d="M16 78 C 22 76, 28 68, 32 58 C 36 46, 42 34, 52 26 C 60 20, 70 18, 80 16"
    stroke="url(#trailGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Secondary Dynamic Ascent Wave -->
  <path
    d="M26 84 C 36 82, 44 74, 50 62 C 55 52, 60 40, 72 32 C 78 28, 84 26, 88 24"
    stroke="url(#trailGrad)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="4 3"
    opacity="0.7"
  />

  <!-- 2. The 3D Isometric Gold Coin (Center-Right focal point) -->
  <g filter="url(#coinShadow)">
    <!-- Coin Extrusion / 3D Edge -->
    <ellipse cx="53" cy="52" rx="21" ry="21" fill="#78350f" />
    <ellipse cx="53" cy="50.5" rx="21" ry="21" fill="#92400e" />

    <!-- Coin Outer Rim -->
    <ellipse cx="53" cy="49" rx="21" ry="21" fill="url(#goldOuter)" stroke="#fef08a" stroke-width="1.2" />

    <!-- Coin Inner Inset Bed -->
    <ellipse cx="53" cy="49" rx="16.5" ry="16.5" fill="url(#goldInner)" />

    <!-- Coin Mirror Bevel Line -->
    <ellipse cx="53" cy="49" rx="13.5" ry="13.5" stroke="#b45309" stroke-width="1" stroke-dasharray="2 2" opacity="0.65" />

    <!-- Coin Center Glyph: Stylized Minimalist Geometric Currency Wing -->
    <path
      d="M48 40 L58 40 C62.5 40, 62.5 49, 58 49 L49 49 L59 58"
      stroke="#78350f"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <line x1="45" y1="44.5" x2="55" y2="44.5" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />

    <!-- Coin Radial Glass Highlight Reflection -->
    <ellipse cx="53" cy="49" rx="21" ry="21" fill="url(#coinShine)" />
  </g>

  <!-- 3. The Front Trail Ribbon (Sweeping OVER the coin bottom, creating true 3D depth) -->
  <path
    d="M34 62 C 38 68, 44 73, 52 75 C 62 77, 72 73, 79 65"
    stroke="url(#trailGrad)"
    stroke-width="4"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />

  <!-- 4. Dynamic Velocity Data Dots Along the Trail -->
  <circle cx="24" cy="74" r="2.5" fill="#34d399" />
  <circle cx="34" cy="60" r="2" fill="#67e8f9" />
  <circle cx="68" cy="28" r="2" fill="#38bdf8" />
  <circle cx="78" cy="20" r="3" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- 5. Brilliant 4-Point North Star / Financial Spark at the apex -->
  <g transform="translate(80, 16)">
    <path
      d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7 Z"
      fill="#ffffff"
      filter="url(#neonGlow)"
    />
    <circle cx="0" cy="0" r="1.5" fill="#fef08a" />
  </g>
</svg>
